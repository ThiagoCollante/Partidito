<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Multiplayer - Over The Shoulder</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: rgba(0, 0, 0, 0.8); color: white; z-index: 10; transition: opacity 0.3s ease;
        }
        #ui-layer.hidden { opacity: 0; pointer-events: none; }

        .btn-start {
            padding: 15px 30px; font-size: 1.2rem; font-weight: bold; color: #fff; background-color: #0078d7;
            border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; margin-top: 15px;
        }
        .btn-start:hover { background-color: #005a9e; transform: scale(1.05); }

        .room-input {
            padding: 12px; font-size: 1.1rem; border-radius: 8px; border: none; outline: none; text-align: center; width: 250px;
        }

        .instructions { margin-top: 20px; text-align: center; color: #ccc; }
        
        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 5; pointer-events: none; display: none;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1 style="margin-bottom: 10px;">Lobby Multijugador</h1>
        <input type="text" id="roomCode" class="room-input" value="Lobby1" placeholder="Código de la sala">
        <button id="btn-start" class="btn-start">Unirse a la Partida</button>
        <div class="instructions">
            <p><strong>W, A, S, D</strong> - Moverse</p>
            <p><strong>ESPACIO</strong> - Saltar</p>
            <p><strong>Ratón</strong> - Mirar</p>
            <p><strong>ESC</strong> - Pausar / Salir</p>
        </div>
    </div>

    <div class="crosshair" id="crosshair"></div>
    <div id="canvas-container"></div>

    <script>
        const socket = io();
        let myId = null;
        let isJoined = false;

        let scene, camera, renderer;
        
        // Almacenamiento Multijugador
        const players = {}; // Diccionario con los THREE.Group de todos
        const meshes = {};  // Diccionario para objetos y entornos
        const targetStates = { players: {}, objects: {} };

        let yaw = 0; let pitch = 0;
        const mouseSensitivity = 0.002;
        const keys = { w: false, a: false, s: false, d: false, space: false };

        const uiLayer = document.getElementById('ui-layer');
        const btnStart = document.getElementById('btn-start');
        const crosshair = document.getElementById('crosshair');

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(100, 100, 0x555555, 0xaaaaaa);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 }));
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            configurarControles();
            window.addEventListener('resize', onWindowResize);
        }

        // --- SISTEMA MULTIJUGADOR ---
        socket.on('connect', () => { myId = socket.id; });

        // Convierte tu personaje en un prefab instanciable
        function crearPersonaje(id) {
            const character = new THREE.Group();
            
            const isMe = (id === myId);
            const colorBody = isMe ? 0x0078d7 : 0xff3333; // Tú eres azul, los demás rojos

            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16); 
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorBody, roughness: 0.4 });
            const characterBody = new THREE.Mesh(bodyGeo, bodyMat);
            characterBody.position.y = 1; 
            characterBody.castShadow = true;
            character.add(characterBody);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
            head.position.set(0, 0.7, -0.2); 
            characterBody.add(head);

            const pack = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: 0x004488 }));
            pack.position.set(0, 0.1, 0.4);
            characterBody.add(pack);

            // Solo agregamos la cámara al jugador local
            if (isMe) {
                const cameraPivot = new THREE.Object3D();
                cameraPivot.position.y = 1.5; 
                character.add(cameraPivot);

                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(0.8, 0.3, 2.5); 
                cameraPivot.add(camera);

                character.userData.cameraPivot = cameraPivot; // Guardar referencia para rotarlo
            }

            scene.add(character);
            return character;
        }

        socket.on('gameState', (state) => {
            targetStates.players = state.players;
            targetStates.objects = state.objects;

            // Renderizar Jugadores
            for (let id in state.players) {
                if (!players[id]) players[id] = crearPersonaje(id);
            }

            // Renderizar Objetos dinámicos (Cajas del servidor)
            for (let id in state.objects) {
                if (!meshes[id]) {
                    const objMat = new THREE.MeshStandardMaterial({ color: 0xffa500 });
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), objMat);
                    mesh.castShadow = true; mesh.receiveShadow = true;
                    scene.add(mesh);
                    meshes[id] = mesh;
                }
            }
        });

        socket.on('playerLeft', (id) => {
            if (players[id]) { scene.remove(players[id]); delete players[id]; }
        });

        // --- CONTROLES Y EVENTOS ---
        function configurarControles() {
            btnStart.addEventListener('click', () => {
                if (!isJoined) {
                    socket.emit('joinRoom', document.getElementById('roomCode').value);
                    isJoined = true;
                }
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    uiLayer.classList.add('hidden');
                    crosshair.style.display = 'block';
                } else {
                    uiLayer.classList.remove('hidden');
                    crosshair.style.display = 'none';
                    keys.w = keys.a = keys.s = keys.d = keys.space = false;
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= event.movementX * mouseSensitivity;
                    pitch -= event.movementY * mouseSensitivity;
                    pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 4, pitch));

                    if (players[myId]) {
                        // Rotación instantánea local
                        players[myId].rotation.y = yaw; 
                        players[myId].userData.cameraPivot.rotation.x = pitch;
                    }
                }
            });

            window.addEventListener('keydown', (e) => { 
                if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; 
                if(e.code === 'Space') keys.space = true;
            });
            window.addEventListener('keyup', (e) => { 
                if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; 
                if(e.code === 'Space') keys.space = false;
            });
        }

        function onWindowResize() {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- BUCLE MULTIJUGADOR ---
        const tempVec = new THREE.Vector3();
        const tempQuat = new THREE.Quaternion();

        function animate() {
            requestAnimationFrame(animate);

            if (isJoined) {
                // 1. Enviar intención de movimiento al servidor
                socket.emit('input', { keys, yaw });

                const lerpFactor = 0.3;

                // 2. Interpolar la posición de todos los jugadores
                for (let id in targetStates.players) {
                    if (players[id]) {
                        const target = targetStates.players[id];
                        tempVec.set(target.x, target.y, target.z);
                        players[id].position.lerp(tempVec, lerpFactor);

                        // Si es otro jugador, interpolar su rotación (yaw) para verlo girar
                        if (id !== myId) {
                            const euler = new THREE.Euler(0, target.yaw, 0);
                            tempQuat.setFromEuler(euler);
                            players[id].quaternion.slerp(tempQuat, lerpFactor);
                        }
                    }
                }

                // 3. Interpolar cajas físicas
                for (let id in targetStates.objects) {
                    if (meshes[id]) {
                        const target = targetStates.objects[id];
                        tempVec.set(target.x, target.y, target.z);
                        meshes[id].position.lerp(tempVec, lerpFactor);
                        tempQuat.set(target.qx, target.qy, target.qz, target.qw);
                        meshes[id].quaternion.slerp(tempQuat, lerpFactor);
                    }
                }
            }

            if (camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
