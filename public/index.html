<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Juego Físicas Multiplayer</title>
    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
    <div id="ui" style="position: absolute; z-index: 10; padding: 10px; color: white; background: rgba(0,0,0,0.5);">
        <input type="text" id="roomCode" placeholder="Código de Sala" value="lobby1">
        <button onclick="joinRoom()">Unirse</button>
    </div>

    <!-- Importar Three.js y Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const socket = io();
        let myId = null;
        let isJoined = false;

        // --- Configuración Three.js ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminación
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Entorno visual
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Almacenamiento de mallas visuales y posiciones objetivo
        const meshes = {};
        const targetStates = { players: {}, objects: {} };

        // Materiales
        const playerMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const otherPlayerMat = new THREE.MeshLambertMaterial({ color: 0x0000ff });
        const boxMat = new THREE.MeshLambertMaterial({ color: 0xffff00 });

        socket.on('connect', () => { myId = socket.id; });

        window.joinRoom = () => {
            const roomCode = document.getElementById('roomCode').value;
            socket.emit('joinRoom', roomCode);
            document.getElementById('ui').style.display = 'none';
            isJoined = true;
        };

        // Recibir el estado del servidor (30 veces por segundo)
        socket.on('gameState', (state) => {
            // Actualizar posiciones objetivo (no movemos la malla inmediatamente)
            targetStates.players = state.players;
            targetStates.objects = state.objects;

            // Instanciar jugadores nuevos
            for (let id in state.players) {
                if (!meshes[id]) {
                    const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), id === myId ? playerMat : otherPlayerMat);
                    scene.add(mesh);
                    meshes[id] = mesh;
                }
            }

            // Instanciar objetos de físicas nuevos
            for (let id in state.objects) {
                if (!meshes[id]) {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), boxMat); // Tamaño 2x2x2 porque Cannon usa half-extents
                    scene.add(mesh);
                    meshes[id] = mesh;
                }
            }
        });

        socket.on('playerLeft', (id) => {
            if (meshes[id]) {
                scene.remove(meshes[id]);
                delete meshes[id];
            }
        });

        // Controles locales
        const keys = { up: false, down: false, left: false, right: false };
        window.addEventListener('keydown', (e) => {
            if(e.key === 'w') keys.up = true;
            if(e.key === 's') keys.down = true;
            if(e.key === 'a') keys.left = true;
            if(e.key === 'd') keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'w') keys.up = false;
            if(e.key === 's') keys.down = false;
            if(e.key === 'a') keys.left = false;
            if(e.key === 'd') keys.right = false;
        });

        // --- Bucle Render Cliente (60+ FPS) ---
        function animate() {
            requestAnimationFrame(animate);

            if (isJoined) {
                // Enviar input al servidor continuamente
                socket.emit('move', keys);

                // INTERPOLACIÓN (El secreto de la suavidad)
                const lerpFactor = 0.2; // Qué tan rápido se suaviza (0 a 1)

                for (let id in targetStates.players) {
                    if (meshes[id]) {
                        const targetPos = targetStates.players[id];
                        meshes[id].position.lerp(new THREE.Vector3(targetPos.x, targetPos.y, targetPos.z), lerpFactor);
                    }
                }

                for (let id in targetStates.objects) {
                    if (meshes[id]) {
                        const target = targetStates.objects[id];
                        meshes[id].position.lerp(new THREE.Vector3(target.x, target.y, target.z), lerpFactor);
                        
                        // Para rotaciones físicas suaves, usamos slerp (Spherical Lerp)
                        const targetQuat = new THREE.Quaternion(target.qx, target.qy, target.qz, target.qw);
                        meshes[id].quaternion.slerp(targetQuat, lerpFactor);
                    }
                }

                // CÁMARA OVER-THE-SHOULDER
                if (meshes[myId]) {
                    const playerPos = meshes[myId].position;
                    
                    // Posición deseada: detrás, arriba y un poco a la derecha del jugador
                    const offset = new THREE.Vector3(2, 4, 8); 
                    const targetCamPos = playerPos.clone().add(offset);
                    
                    // Suavizar también el movimiento de la cámara para que no maree
                    camera.position.lerp(targetCamPos, 0.1);
                    camera.lookAt(playerPos);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
