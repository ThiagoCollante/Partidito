<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA-Style 3D Multiplayer</title>
    <!-- Fixed Script Links -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- WEBSOCKET CLIENT SCRIPT -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        .transition-opacity { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="antialiased">

    <!-- Multiplayer Lobby UI -->
    <div id="lobby-ui" class="absolute inset-0 bg-black/60 backdrop-blur-md z-40 flex items-center justify-center">
        <div class="bg-gray-900 border border-white/20 p-8 rounded-2xl shadow-2xl w-[400px]">
            <h1 class="text-3xl font-black text-white text-center tracking-tight mb-6">PRO SOCCER <span class="text-yellow-400">ONLINE</span></h1>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-white/70 text-xs font-bold uppercase tracking-wider mb-1">Your Nickname</label>
                    <input type="text" id="nickname-input" class="w-full bg-white/10 border border-white/20 rounded-lg p-3 text-white font-bold outline-none focus:border-yellow-400 focus:bg-white/20 transition-all" placeholder="Enter name..." value="Player" maxlength="12">
                </div>
                <hr class="border-white/10 my-4">
                <button id="btn-create" class="w-full bg-green-500 hover:bg-green-400 text-black font-black uppercase tracking-wider py-3 rounded-lg shadow-[0_0_15px_rgba(34,197,94,0.4)] transition-all transform hover:scale-[1.02]">
                    Create New Room
                </button>
                <div class="relative flex items-center py-2">
                    <div class="flex-grow border-t border-white/10"></div>
                    <span class="flex-shrink-0 mx-4 text-white/40 text-xs font-bold">OR</span>
                    <div class="flex-grow border-t border-white/10"></div>
                </div>
                <div class="flex space-x-2">
                    <input type="text" id="room-input" class="flex-1 bg-white/10 border border-white/20 rounded-lg p-3 text-white font-bold text-center uppercase outline-none focus:border-blue-400 focus:bg-white/20 transition-all" placeholder="ROOM CODE" maxlength="4">
                    <button id="btn-join" class="bg-blue-500 hover:bg-blue-400 text-white font-black uppercase tracking-wider px-6 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.4)] transition-all">
                        Join
                    </button>
                </div>
                <p id="lobby-error" class="text-red-400 text-xs font-bold text-center h-4"></p>
            </div>
        </div>
    </div>

    <!-- In-Game UI Overlay (Hidden initially) -->
    <div id="game-ui" class="absolute inset-0 pointer-events-none z-10 hidden">
        <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-black text-white drop-shadow-md tracking-tight">PRO SOCCER <span class="text-yellow-400">ONLINE</span></h1>
                <div class="mt-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/10 inline-flex items-center space-x-2 shadow-lg">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="text-white font-bold tracking-widest text-sm">ROOM: <span id="ui-room-code" class="text-yellow-400">XXXX</span></span>
                </div>
            </div>
            <div class="bg-black/50 backdrop-blur-md p-4 rounded-xl border border-white/10 text-white shadow-xl pointer-events-auto">
                <h3 class="font-bold text-sm text-yellow-400 mb-2 uppercase tracking-wider">Controls</h3>
                <ul class="text-sm space-y-1">
                    <li><kbd class="bg-white/20 px-1.5 py-0.5 rounded">W</kbd> <kbd class="bg-white/20 px-1.5 py-0.5 rounded">A</kbd> <kbd class="bg-white/20 px-1.5 py-0.5 rounded">S</kbd> <kbd class="bg-white/20 px-1.5 py-0.5 rounded">D</kbd> Move</li>
                    <li><kbd class="bg-white/20 px-1.5 py-0.5 rounded">Shift</kbd> Sprint</li>
                    <li><kbd class="bg-white/20 px-1.5 py-0.5 rounded">Space</kbd> (Hold) Power Kick</li>
                    <li><kbd class="bg-white/20 px-1 py-0.5 rounded text-xs">↑</kbd> (No Ball) Jump / Header</li>
                    <li><kbd class="bg-white/20 px-1 py-0.5 rounded text-xs">↑</kbd> (While Volley) Dive</li>
                </ul>
            </div>
        </div>

        <div id="power-container" class="absolute w-20 h-2.5 bg-gray-900 rounded-full overflow-hidden border border-white/20 z-20 opacity-0 transition-opacity duration-150 shadow-md" style="transform: translateX(-50%);">
            <div id="power-bar" class="h-full bg-green-400 w-0"></div>
        </div>

        <div class="absolute bottom-6 left-6 w-64 bg-black/50 backdrop-blur-md p-4 rounded-xl border border-white/10 shadow-xl z-10">
            <div class="flex justify-between items-end mb-2">
                <h3 class="font-bold text-sm text-white uppercase tracking-wider">Stamina</h3>
            </div>
            <div class="w-full h-3 bg-gray-900 rounded-full overflow-hidden border border-white/10">
                <div id="stamina-bar" class="h-full bg-green-400 w-full transition-colors duration-300"></div>
            </div>
        </div>
    </div>

    <div id="game-container" class="w-full h-screen relative z-0"></div>

    <script type="module">
        // Connect to our custom Socket.io server
        const socket = io();

        // Multiplayer State
        let userId = null;
        let isHost = false;
        let currentRoom = null;
        let nickname = "Player";
        let networkBall = { x: 5, y: 0.4, z: 2, possessor: null };
        let remotePlayersData = {}; 
        let remotePlayerMeshes = {}; 

        // UI Elements
        const lobbyUI = document.getElementById('lobby-ui');
        const gameUI = document.getElementById('game-ui');
        const errorText = document.getElementById('lobby-error');
        
        // Setup Socket Listeners
        document.getElementById('btn-create').addEventListener('click', () => {
            nickname = document.getElementById('nickname-input').value || "Host";
            socket.emit('create-room', { nickname });
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            const code = document.getElementById('room-input').value.toUpperCase();
            if (code.length !== 4) return errorText.innerText = "Invalid code.";
            nickname = document.getElementById('nickname-input').value || "Guest";
            socket.emit('join-room', { roomCode: code, nickname });
        });

        socket.on('room-created', (data) => {
            currentRoom = data.roomCode; isHost = data.isHost; userId = data.id; startGame();
        });

        socket.on('room-joined', (data) => {
            currentRoom = data.roomCode; isHost = data.isHost; userId = data.id; startGame();
        });

        socket.on('error', (msg) => errorText.innerText = msg);

        // Receive Global Game State
        socket.on('sync-state', (data) => {
            remotePlayersData = data.players;
            networkBall = data.ball;
        });

        function startGame() {
            lobbyUI.classList.add('hidden');
            gameUI.classList.remove('hidden');
            document.getElementById('ui-room-code').innerText = currentRoom;
            init3DEngine();
        }

        // --- THREE.JS ENGINE ---
        function init3DEngine() {
            const container = document.getElementById('game-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#87CEEB'); 
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Pitch
            function createPitchTexture() {
                const canvas = document.createElement('canvas'); canvas.width = 2048; canvas.height = 1024;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = '#2d8a2d'; ctx.fillRect(0, 0, 2048, 1024);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 8;
                ctx.strokeRect(100, 50, 1848, 924); ctx.beginPath(); ctx.arc(1024, 512, 120, 0, Math.PI*2); ctx.stroke();
                return new THREE.CanvasTexture(canvas);
            }
            const pitch = new THREE.Mesh(new THREE.PlaneGeometry(160, 80), new THREE.MeshStandardMaterial({ map: createPitchTexture(), roughness: 0.8 }));
            pitch.rotation.x = -Math.PI / 2; pitch.receiveShadow = true; scene.add(pitch);

            function createNameplate(name, isLocal = false) {
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = isLocal ? 'rgba(59, 130, 246, 0.7)' : 'rgba(0, 0, 0, 0.6)';
                ctx.roundRect(16, 8, 224, 48, 24); ctx.fill(); ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = isLocal ? '#ffffff' : '#facc15';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(name, 128, 34);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false }));
                sprite.scale.set(3.5, 0.875, 1); sprite.position.set(0, 2.6, 0); return sprite;
            }

            // Local Player
            const playerGroup = new THREE.Group(); playerGroup.rotation.order = 'YXZ'; scene.add(playerGroup);
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16), new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
            body.position.y = 1.3; body.castShadow = true; playerGroup.add(body);
            playerGroup.add(createNameplate(nickname, true));
            playerGroup.position.set(isHost ? -20 : 20, 0, 0);

            // Ball
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            ball.position.set(0, 0.4, 0); ball.castShadow = true; scene.add(ball);

            let ballVelocity = new THREE.Vector3();
            const ballFriction = 0.95;
            let hasPossession = false;
            let possessionCooldown = 0;
            let isCharging = false;
            let isChargingVolley = false;
            let chargeAmount = 0;
            let kickCanceled = false;

            let isJumping = false;
            let jumpType = null;
            let isDiving = false;
            let isRecovering = false;
            let recoveryTimer = 0;
            let playerVelocityY = 0;
            let jumpVelocityX = 0;
            let jumpVelocityZ = 0;

            const keys = { w: false, a: false, s: false, d: false, shift: false, space: false, arrowup: false, arrowdown: false };
            
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if ([' ', 'arrowup', 'arrowdown'].includes(key)) e.preventDefault();
                if (e.repeat) return;
                if (keys.hasOwnProperty(key)) keys[key] = true;
                if (e.key === ' ') keys.space = true; if (e.key === 'Shift') keys.shift = true;
                
                if (key === 'arrowdown') {
                    if (isCharging || isChargingVolley) { isCharging = false; isChargingVolley = false; chargeAmount = 0; kickCanceled = true; }
                } else if (key === 'arrowup') {
                    if (isChargingVolley) {
                        isChargingVolley = false; chargeAmount = 0; kickCanceled = true;
                        isJumping = true; jumpType = 'dive'; isDiving = true; playerVelocityY = 0.25; 
                        jumpVelocityX = Math.sin(activeDribbleAngle) * 15; jumpVelocityZ = Math.cos(activeDribbleAngle) * 15;
                    } else if (!hasPossession && !isJumping && !isRecovering) {
                        isJumping = true; jumpType = 'withoutBall'; playerVelocityY = 0.32; 
                        let speed = (keys.shift && !isChargingVolley) ? 11 : 7;
                        let mX = 0, mZ = 0; if (keys.w) mZ-=1; if (keys.s) mZ+=1; if (keys.a) mX-=1; if (keys.d) mX+=1;
                        const mV = new THREE.Vector2(mX, mZ); if (mV.length() > 0) mV.normalize();
                        jumpVelocityX = mV.x * speed; jumpVelocityZ = mV.y * speed;
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (keys.hasOwnProperty(key)) keys[key] = false;
                if (e.key === ' ') { keys.space = false; kickCanceled = false; }
                if (e.key === 'Shift') keys.shift = false;
            });

            let targetRotation = 0; let activeDribbleAngle = 0; 
            let currentStamina = 100; const maxStamina = 100; let isExhausted = false;

            // Transmit Local State to Server
            setInterval(() => {
                socket.emit('player-update', {
                    roomCode: currentRoom,
                    x: playerGroup.position.x, y: playerGroup.position.y, z: playerGroup.position.z,
                    rotX: playerGroup.rotation.x, rotY: playerGroup.rotation.y
                });
                
                if (hasPossession || (isHost && networkBall.possessor === null)) {
                    socket.emit('ball-update', {
                        roomCode: currentRoom,
                        x: ball.position.x, y: ball.position.y, z: ball.position.z,
                        vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.z,
                        possessor: hasPossession ? userId : null
                    });
                }
            }, 50);

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();

                // MULTIPLAYER LERP
                for (let id in remotePlayersData) {
                    if (id === userId) continue;
                    const data = remotePlayersData[id];
                    if (!remotePlayerMeshes[id]) {
                        const g = new THREE.Group(); g.rotation.order = 'YXZ';
                        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16), new THREE.MeshStandardMaterial({ color: 0xff3333 }));
                        b.position.y = 1.3; g.add(b); g.add(createNameplate(data.nickname));
                        scene.add(g); remotePlayerMeshes[id] = g;
                    }
                    const mesh = remotePlayerMeshes[id];
                    if (Date.now() - data.timestamp > 5000) { scene.remove(mesh); delete remotePlayerMeshes[id]; delete remotePlayersData[id]; continue; }
                    mesh.position.lerp(new THREE.Vector3(data.x, data.y, data.z), 15 * delta);
                    let rotDiffY = data.rotY - mesh.rotation.y; while (rotDiffY < -Math.PI) rotDiffY += Math.PI*2; while (rotDiffY > Math.PI) rotDiffY -= Math.PI*2;
                    mesh.rotation.y += rotDiffY * 15 * delta; mesh.rotation.x += (data.rotX - mesh.rotation.x) * 15 * delta;
                }

                // LOCAL MOVEMENT
                let moveX = 0; let moveZ = 0;
                if (!isRecovering) { if (keys.w) moveZ -= 1; if (keys.s) moveZ += 1; if (keys.a) moveX -= 1; if (keys.d) moveX += 1; }

                if (!hasPossession && keys.space && !kickCanceled && !isJumping && !isRecovering && possessionCooldown <= 0) {
                    isChargingVolley = true; chargeAmount += delta * 0.8; if (chargeAmount > 1) chargeAmount = 1;
                } else if (isChargingVolley) { isChargingVolley = false; chargeAmount = 0; }

                let isSprinting = keys.shift && !isExhausted && (moveX||moveZ) && !isChargingVolley; 
                if (isSprinting) { currentStamina -= 25 * delta; if (currentStamina < 0) currentStamina = 0; } 
                else if (!keys.shift) { currentStamina += 15 * delta; if (currentStamina > maxStamina) currentStamina = maxStamina; }
                
                document.getElementById('stamina-bar').style.width = `${(currentStamina / maxStamina) * 100}%`;
                if (currentStamina <= 0) isExhausted = true; else if (currentStamina >= 25) isExhausted = false;

                const moveVec = new THREE.Vector2(moveX, moveZ);
                if (isJumping) {
                    playerGroup.position.x += jumpVelocityX * delta; playerGroup.position.z += jumpVelocityZ * delta;
                    playerVelocityY -= 0.015; playerGroup.position.y += playerVelocityY;
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0; isJumping = false;
                        if (jumpType === 'dive') { isDiving = false; isRecovering = true; recoveryTimer = 1.5; }
                        jumpType = null;
                    }
                    if (moveVec.length() > 0) { moveVec.normalize(); targetRotation = Math.atan2(moveVec.x, moveVec.y); activeDribbleAngle = targetRotation; }
                } else {
                    if (moveVec.length() > 0) {
                        moveVec.normalize(); targetRotation = Math.atan2(moveVec.x, moveVec.y); activeDribbleAngle = targetRotation;
                        let speed = isSprinting ? 11 : 7; if (isChargingVolley) speed = 3.5; 
                        playerGroup.position.x += moveVec.x * speed * delta; playerGroup.position.z += moveVec.y * speed * delta;
                    } else { targetRotation = playerGroup.rotation.y; activeDribbleAngle = playerGroup.rotation.y; }
                }

                playerGroup.position.x = Math.max(-78, Math.min(78, playerGroup.position.x)); playerGroup.position.z = Math.max(-38, Math.min(38, playerGroup.position.z));
                let rotDiff = targetRotation - playerGroup.rotation.y; while (rotDiff < -Math.PI) rotDiff += Math.PI * 2; while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
                playerGroup.rotation.y += rotDiff * 10 * delta; 

                if (isDiving) playerGroup.rotation.x -= (playerGroup.rotation.x - (-Math.PI / 2.2)) * 12 * delta;
                else if (isRecovering) {
                    recoveryTimer -= delta; if (recoveryTimer < 1.0) playerGroup.rotation.x -= (playerGroup.rotation.x - 0) * 6 * delta;
                    if (recoveryTimer <= 0) { isRecovering = false; playerGroup.rotation.x = 0; }
                } else playerGroup.rotation.x = 0; 

                if (possessionCooldown > 0) possessionCooldown -= delta;

                // BALL LOGIC
                if (!hasPossession && networkBall.possessor !== null && networkBall.possessor !== userId) {
                    ball.position.lerp(new THREE.Vector3(networkBall.x, networkBall.y, networkBall.z), 15 * delta);
                } else if (!hasPossession && (isHost && networkBall.possessor === null)) {
                    ballVelocity.y -= 0.015; ball.position.add(ballVelocity);
                    if (ball.position.y <= 0.4) { ball.position.y = 0.4; if (ballVelocity.y < -0.05) { ballVelocity.y *= -0.6; ballVelocity.x *= 0.9; ballVelocity.z *= 0.9; } else { ballVelocity.y = 0; ballVelocity.x *= ballFriction; ballVelocity.z *= ballFriction; } }
                    if (ball.position.x > 79 || ball.position.x < -79) { ballVelocity.x *= -1; ball.position.x = Math.sign(ball.position.x) * 79; }
                    if (ball.position.z > 39 || ball.position.z < -39) { ballVelocity.z *= -1; ball.position.z = Math.sign(ball.position.z) * 39; }
                } else if (!hasPossession && (!isHost && networkBall.possessor === null)) {
                    ball.position.lerp(new THREE.Vector3(networkBall.x, networkBall.y, networkBall.z), 15 * delta);
                    ballVelocity.set(networkBall.vx, networkBall.vy, networkBall.vz); 
                }

                let pCenter = playerGroup.position.clone();
                if (isJumping && jumpType === 'withoutBall') pCenter.y += 1.2; 
                else if (isJumping && jumpType === 'dive') { pCenter.x += Math.sin(activeDribbleAngle); pCenter.z += Math.cos(activeDribbleAngle); pCenter.y += 0.5; }
                
                if (!hasPossession && !isRecovering && pCenter.distanceTo(ball.position) < 1.5 && possessionCooldown <= 0) {
                    if (isChargingVolley) {
                        const ks = 0.35 + (chargeAmount * 0.9); ballVelocity.set(Math.sin(activeDribbleAngle)*ks, 0.22 + (0.15*chargeAmount), Math.cos(activeDribbleAngle)*ks);
                        possessionCooldown = 0.5; isChargingVolley = false; chargeAmount = 0; kickCanceled = true; socket.emit('ball-update', { roomCode: currentRoom, x: ball.position.x, y: ball.position.y, z: ball.position.z, vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.z, possessor: null });
                    } else if (isJumping && jumpType === 'dive') {
                        ballVelocity.set(Math.sin(activeDribbleAngle)*0.5 + jumpVelocityX*delta, 0.25, Math.cos(activeDribbleAngle)*0.5 + jumpVelocityZ*delta);
                        possessionCooldown = 0.8; socket.emit('ball-update', { roomCode: currentRoom, x: ball.position.x, y: ball.position.y, z: ball.position.z, vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.z, possessor: null });
                    } else if (isJumping && jumpType === 'withoutBall') {
                        ballVelocity.set(jumpVelocityX*delta*1.6 + Math.sin(activeDribbleAngle)*0.2, 0.30, jumpVelocityZ*delta*1.6 + Math.cos(activeDribbleAngle)*0.2);
                        possessionCooldown = 0.4; socket.emit('ball-update', { roomCode: currentRoom, x: ball.position.x, y: ball.position.y, z: ball.position.z, vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.z, possessor: null });
                    } else {
                        hasPossession = true;
                    }
                }

                if (hasPossession) {
                    if (pCenter.distanceTo(ball.position) > 6.0) { hasPossession = false; isCharging = false; chargeAmount = 0; }
                    else {
                        if (!isCharging && keys.space && !kickCanceled && !isRecovering) { isCharging = true; chargeAmount = 0; }
                        if (isCharging) {
                            if (keys.space) { chargeAmount += delta * 0.8; if (chargeAmount > 1) chargeAmount = 1; } 
                            else {
                                hasPossession = false; possessionCooldown = 0.5;
                                const ks = 0.3 + (chargeAmount * 0.9); ballVelocity.set(Math.sin(activeDribbleAngle)*ks, 0.12 + (0.1*chargeAmount), Math.cos(activeDribbleAngle)*ks);
                                isCharging = false; chargeAmount = 0; socket.emit('ball-update', { roomCode: currentRoom, x: ball.position.x, y: ball.position.y, z: ball.position.z, vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.z, possessor: null });
                            }
                        }
                        if (hasPossession) {
                            const tX = playerGroup.position.x + Math.sin(activeDribbleAngle) * 1.5; const tZ = playerGroup.position.z + Math.cos(activeDribbleAngle) * 1.5;
                            if (Math.hypot(tX - ball.position.x, tZ - ball.position.z) > 0.15) { const dl = 6 * delta; ball.position.x += (tX - ball.position.x)*dl; ball.position.z += (tZ - ball.position.z)*dl; } 
                            else { ball.position.x = tX; ball.position.z = tZ; }
                            ball.position.y = 0.4 + playerGroup.position.y; ballVelocity.set(0,0,0);
                        }
                    }
                }

                // UI & Camera updates
                const pCont = document.getElementById('power-container'); const pBar = document.getElementById('power-bar');
                if (isCharging || isChargingVolley) {
                    pCont.style.opacity = '1'; pBar.style.width = `${chargeAmount * 100}%`;
                    const pp = playerGroup.position.clone(); pp.y = 0; pp.project(camera);
                    pCont.style.left = `${(pp.x * 0.5 + 0.5) * window.innerWidth}px`; pCont.style.top = `${(-(pp.y * 0.5) + 0.5) * window.innerHeight + 25}px`; 
                } else { pCont.style.opacity = '0'; pBar.style.width = '0%'; }

                camera.position.x += (playerGroup.position.x - camera.position.x) * (3.0 * delta);
                camera.position.y += (30 - camera.position.y) * (3.0 * delta);
                camera.position.z += (45 + (playerGroup.position.z * 0.2) - camera.position.z) * (3.0 * delta);
                camera.lookAt(playerGroup.position.x, 0, playerGroup.position.z * 0.5);

                renderer.render(scene, camera);
            }

            camera.position.set(0, 30, 45); animate();
        }
    </script>
</body>
</html>
