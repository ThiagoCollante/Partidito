<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Multiplayer - Fútbol Arena Sin Lag</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: rgba(0, 0, 0, 0.85); color: white; z-index: 10; transition: opacity 0.3s ease;
        }
        #ui-layer.hidden { opacity: 0; pointer-events: none; }

        .btn-start {
            padding: 15px 30px; font-size: 1.2rem; font-weight: bold; color: #fff; background-color: #28a745;
            border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; margin-top: 15px;
        }
        .btn-start:hover { background-color: #218838; transform: scale(1.05); }

        .room-input {
            padding: 12px; font-size: 1.1rem; border-radius: 8px; border: none; outline: none; text-align: center; width: 250px; margin-bottom: 10px;
        }

        .instructions { margin-top: 20px; text-align: center; color: #ccc; line-height: 1.6; }
        .hotkey { background: #333; padding: 2px 6px; border-radius: 4px; border-bottom: 2px solid #111; font-family: monospace; font-weight: bold; color: #00ffaa; }

        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 5; pointer-events: none; display: none;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1 style="margin-bottom: 10px; color: #44ff44;">Cancha 5v5</h1>
        <input type="text" id="nicknameInput" class="room-input" placeholder="Tu Nombre" maxlength="12">
        <input type="text" id="roomCode" class="room-input" value="Estadio1" placeholder="Código de la sala">
        
        <button id="btn-start" class="btn-start">Entrar a la Cancha</button>
        <div class="instructions">
            <p><strong>Camina sobre la pelota</strong> para tener la posesión.</p>
            <p><span class="hotkey">CLICK IZQ</span> - Patear Pelota (Donde mires)</p>
            <p><span class="hotkey">W</span> <span class="hotkey">A</span> <span class="hotkey">S</span> <span class="hotkey">D</span> - Moverse | <span class="hotkey">ESPACIO</span> - Saltar</p>
            <p><strong>Ratón</strong> - Mirar y apuntar</p>
        </div>
    </div>

    <div class="crosshair" id="crosshair"></div>
    <div id="canvas-container"></div>

    <script>
        const socket = io();
        let myId = null;
        let isJoined = false;

        let scene, camera, renderer;
        
        const players = {}; 
        const meshes = {};  
        const targetStates = { players: {}, objects: {} };

        let yaw = 0; let pitch = 0;
        const mouseSensitivity = 0.002;
        const keys = { w: false, a: false, s: false, d: false, space: false };

        // SOLUCIÓN AL LAG: Control de tiempo de envío
        let lastSendTime = 0;

        const uiLayer = document.getElementById('ui-layer');
        const btnStart = document.getElementById('btn-start');
        const crosshair = document.getElementById('crosshair');

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); 
            scene.fog = new THREE.Fog(0x87ceeb, 30, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 50, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(-20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 40;
            dirLight.shadow.camera.bottom = -40;
            scene.add(dirLight);

            const fieldWidth = 40;
            const fieldLength = 60;

            const floorMat = new THREE.MeshStandardMaterial({ color: 0x116e25, roughness: 1.0 }); 
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(fieldWidth, fieldLength), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            function crearLinea(w, d, x, z) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(x, 0.02, z); 
                scene.add(line);
            }
            
            crearLinea(fieldWidth, 0.3, 0, 0);
            const ringGeo = new THREE.RingGeometry(4.7, 5, 32);
            const ring = new THREE.Mesh(ringGeo, lineMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.02;
            scene.add(ring);
            
            crearLinea(20, 0.3, 0, -22); 
            crearLinea(0.3, 8, -10, -26); 
            crearLinea(0.3, 8, 10, -26); 
            crearLinea(20, 0.3, 0, 22); 
            crearLinea(0.3, 8, -10, 26); 
            crearLinea(0.3, 8, 10, 26); 

            function crearArco(zPos, rotY) {
                const goalGroup = new THREE.Group();
                const postMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.8 });
                const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, side: THREE.DoubleSide, wireframe: true });

                const postL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3, 16), postMat);
                postL.position.set(-5, 1.5, 0); postL.castShadow = true; goalGroup.add(postL);
                const postR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3, 16), postMat);
                postR.position.set(5, 1.5, 0); postR.castShadow = true; goalGroup.add(postR);
                const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 10.3, 16), postMat);
                cross.rotation.z = Math.PI / 2; cross.position.set(0, 3, 0); cross.castShadow = true; goalGroup.add(cross);

                const netBack = new THREE.Mesh(new THREE.PlaneGeometry(10, 3), netMat);
                netBack.position.set(0, 1.5, -1.5); goalGroup.add(netBack);
                const netTop = new THREE.Mesh(new THREE.PlaneGeometry(10, 1.5), netMat);
                netTop.rotation.x = -Math.PI / 2; netTop.position.set(0, 3, -0.75); goalGroup.add(netTop);
                const netL = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 3), netMat);
                netL.rotation.y = Math.PI / 2; netL.position.set(-5, 1.5, -0.75); goalGroup.add(netL);
                const netR = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 3), netMat);
                netR.rotation.y = -Math.PI / 2; netR.position.set(5, 1.5, -0.75); goalGroup.add(netR);

                goalGroup.position.set(0, 0, zPos);
                goalGroup.rotation.y = rotY;
                scene.add(goalGroup);
            }

            crearArco(-28.5, 0); 
            crearArco(28.5, Math.PI); 

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.8 });
            const wallGeoX = new THREE.PlaneGeometry(fieldLength, 10);
            const wallGeoZ = new THREE.PlaneGeometry(fieldWidth, 10);
            
            const wallN = new THREE.Mesh(wallGeoZ, wallMat); wallN.position.set(0, 5, -fieldLength/2); wallN.receiveShadow = true; scene.add(wallN);
            const wallS = new THREE.Mesh(wallGeoZ, wallMat); wallS.position.set(0, 5, fieldLength/2); wallS.rotation.y = Math.PI; wallS.receiveShadow = true; scene.add(wallS);
            const wallE = new THREE.Mesh(wallGeoX, wallMat); wallE.position.set(fieldWidth/2, 5, 0); wallE.rotation.y = -Math.PI / 2; wallE.receiveShadow = true; scene.add(wallE);
            const wallW = new THREE.Mesh(wallGeoX, wallMat); wallW.position.set(-fieldWidth/2, 5, 0); wallW.rotation.y = Math.PI / 2; wallW.receiveShadow = true; scene.add(wallW);

            configurarControles();
            window.addEventListener('resize', onWindowResize);
        }

        socket.on('connect', () => { myId = socket.id; });

        function crearTextoSala(mensaje) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 128;
            context.font = "Bold 32px Arial"; context.textAlign = "center";
            context.fillStyle = "rgba(0,0,0,0.8)"; context.fillText(mensaje, 130, 66);
            context.fillStyle = "white"; context.fillText(mensaje, 128, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false }); 
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(3, 1.5, 1);
            sprite.position.y = 2.6; 
            return sprite;
        }

        function crearPersonaje(id, nickname) {
            const character = new THREE.Group();
            
            const isMe = (id === myId);
            const colorBody = isMe ? 0x0078d7 : 0xff3333; 

            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16); 
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorBody, roughness: 0.4 });
            const characterBody = new THREE.Mesh(bodyGeo, bodyMat);
            characterBody.position.y = 1; 
            characterBody.castShadow = true;
            character.add(characterBody);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
            head.position.set(0, 0.7, -0.2); 
            characterBody.add(head);

            const nombreMostrar = nickname || "Jugador";
            const cartelNombre = crearTextoSala(nombreMostrar);
            character.add(cartelNombre); 

            const hitboxGeo = new THREE.CylinderGeometry(2.0, 2.0, 0.1, 16);
            const hitboxMat = new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.4, depthWrite: false });
            const hitbox = new THREE.Mesh(hitboxGeo, hitboxMat);
            hitbox.position.set(0, 0.05, 0); 
            character.add(hitbox);
            character.userData.hitboxMat = hitboxMat;

            if (isMe) {
                const cameraPivot = new THREE.Object3D();
                cameraPivot.position.y = 1.5; 
                character.add(cameraPivot);

                camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 500);
                camera.position.set(0.8, 0.5, 3.0); 
                cameraPivot.add(camera);

                character.userData.cameraPivot = cameraPivot; 
            }

            scene.add(character);
            return character;
        }

        socket.on('gameState', (state) => {
            targetStates.players = state.players;
            targetStates.objects = state.objects;

            for (let id in state.players) {
                if (!players[id]) players[id] = crearPersonaje(id, state.players[id].nickname);
            }

            for (let id in state.objects) {
                if (!meshes[id]) {
                    if (state.objects[id].shape === 'soccer_ball') {
                        const objMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.1 }); 
                        const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), objMat); 
                        mesh.castShadow = true; mesh.receiveShadow = true;
                        scene.add(mesh);
                        meshes[id] = mesh;
                    }
                }
            }
        });

        socket.on('playerLeft', (id) => {
            if (players[id]) { scene.remove(players[id]); delete players[id]; }
        });

        function configurarControles() {
            btnStart.addEventListener('click', () => {
                if (!isJoined) {
                    const roomCode = document.getElementById('roomCode').value;
                    const nickname = document.getElementById('nicknameInput').value || "Jugador";
                    
                    socket.emit('joinRoom', { roomId: roomCode, nickname: nickname });
                    isJoined = true;
                }
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    uiLayer.classList.add('hidden');
                    crosshair.style.display = 'block';
                } else {
                    uiLayer.classList.remove('hidden');
                    crosshair.style.display = 'none';
                    keys.w = keys.a = keys.s = keys.d = keys.space = false;
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= event.movementX * mouseSensitivity;
                    pitch -= event.movementY * mouseSensitivity;
                    // Limitamos la cámara para que no puedas dar la vuelta completa por arriba o por abajo
                    pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 4, pitch));

                    if (players[myId]) {
                        players[myId].rotation.y = yaw; 
                        players[myId].userData.cameraPivot.rotation.x = pitch;
                    }
                }
            });

            document.addEventListener('mousedown', (event) => {
                if (document.pointerLockElement === document.body && event.button === 0) {
                    socket.emit('attack'); 

                    if (players[myId]) {
                        const mat = players[myId].userData.hitboxMat;
                        mat.color.setHex(0xffffff); 
                        setTimeout(() => { mat.color.setHex(0xff4444); }, 100); 
                    }
                }
            });

            window.addEventListener('keydown', (e) => { 
                if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; 
                if(e.code === 'Space') keys.space = true;
            });
            window.addEventListener('keyup', (e) => { 
                if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; 
                if(e.code === 'Space') keys.space = false;
            });
        }

        function onWindowResize() {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const tempVec = new THREE.Vector3();
        const tempQuat = new THREE.Quaternion();

        function animate() {
            requestAnimationFrame(animate);

            if (isJoined) {
                const now = Date.now();
                // SOLUCIÓN AL LAG: Enviamos la información al servidor solo 30 veces por segundo, no a 144hz.
                if (now - lastSendTime > 1000 / 30) {
                    // Ahora se incluye el "pitch" en el envío
                    socket.emit('input', { keys, yaw, pitch });
                    lastSendTime = now;
                }
                
                const lerpFactor = 0.2; // Interpolación más suave

                for (let id in targetStates.players) {
                    if (players[id]) {
                        const target = targetStates.players[id];
                        tempVec.set(target.x, target.y, target.z);
                        players[id].position.lerp(tempVec, lerpFactor);

                        if (id !== myId) {
                            const euler = new THREE.Euler(0, target.yaw, 0);
                            tempQuat.setFromEuler(euler);
                            players[id].quaternion.slerp(tempQuat, lerpFactor);
                        }
                    }
                }

                for (let id in targetStates.objects) {
                    if (meshes[id]) {
                        const target = targetStates.objects[id];
                        tempVec.set(target.x, target.y, target.z);
                        meshes[id].position.lerp(tempVec, lerpFactor);
                        tempQuat.set(target.qx, target.qy, target.qz, target.qw);
                        meshes[id].quaternion.slerp(tempQuat, lerpFactor);
                    }
                }
            }

            if (camera) renderer.render(scene, camera);
        }
    </script>
</body>
</html>
